<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Producto - Vértice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sulphur+Point:wght@300;400;700&display=swap" />
    <link rel="stylesheet" href="./assets/css/comercio.productos.css" />
    <link rel="icon" type="image/x-icon" href="../front-vertice/assets/imgs/v-vertice.png" />
</head>
<style>
  /* --- Estilo General para los Botones --- */

  /* 1. Define el estilo base para TODOS los .btn */
  .btn {
    /* Quita el "resaltado" (Outline y Shadow de Foco) */
    text-decoration: none !important; /* Quita cualquier subrayado */
    outline: none !important;         /* Quita el borde azul de foco */
    box-shadow: none !important;       /* Quita la sombra de foco de Bootstrap */

    /* Estilo Moderno */
    border: none;
    border-radius: 8px;                /* Bordes redondeados */
    font-weight: 600;
    padding: 10px 18px;
    gap: 8px;                          /* Espacio entre icono y texto */
    
    /* Permite alinear icono y texto */
    display: inline-flex; 
    align-items: center;
    
    /* Efecto Hover */
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  /* Efecto "flotar" al pasar el mouse */
  .btn:hover {
    transform: translateY(-2px); /* Se eleva un poquito */
  }

  /* 2. ESTILO PARA BOTONES VERDES (Primarios) */
  /* Se aplica a "Visitar mi tienda" Y "Nuevo producto" */
  .btn-primary {
    background-color: #28a745; /* Verde profesional */
    color: white !important;   /* El !important asegura que el texto sea blanco */
  }
  .btn-primary:hover {
    background-color: #218838; 
  }

  /* 3. ESTILO PARA BOTONES GRISES (Secundarios) */
  /* Se aplica a "Mi Cuenta" y "Filtros" */
  .btn-secondary {
    background-color: #f0f2f5; 
    color: #444 !important;
  }
  .btn-secondary:hover {
    background-color: #e2e6ea; 
  }

  /* 4. ESPACIO ENTRE BOTONES DEL HEADER */
  .header-buttons {
    display: flex;
    gap: 12px; /* <-- ¡AQUÍ ESTÁ EL ESPACIO QUE PEDISTE! */
  }
  /* --- Estilo de Layout General del Dashboard --- */

  html, body {
    /* Asegura que la página pueda usar la altura completa */
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #f8f9fa; /* Color de fondo general si algo se "escapa" */
  }

  .dashboard-container {
    /* 1. USA FLEXBOX PARA EL LAYOUT */
    /* Esto divide el contenedor en columnas (sidebar y main) */
    display: flex;
    
    /* 2. ALTURA MÍNIMA DE 100% DE LA VENTANA */
    /* Esto fuerza al contenedor a ocupar, como mínimo,
       toda la altura de la pantalla del navegador. */
    min-height: 100vh;
  }

  .sidebar {
    /* 3. ANCHO FIJO PARA EL SIDEBAR */
    /* (Ajusta este número si quieres que sea más ancho o angosto) */
    width: 260px;
    
    /* Evita que el sidebar se encoja si el contenido es muy grande */
    flex-shrink: 0;
    
    /* Fondo blanco (basado en tus capturas) */
    background-color: #ffffff;
    
    /* Un borde sutil para separarlo del contenido */
    border-right: 1px solid #e9ecef;
  }

  .main-content {
    /* 4. EL CONTENIDO TOMA EL RESTO DEL ESPACIO */
    /* "flex-grow: 1" le dice que ocupe todo el espacio sobrante */
    flex-grow: 1;
    
    /* El padding y demás ya lo tienes en tu CSS `comercio.productos.css` */
  }
</style>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <img src="./assets/imgs/vertice-logo-largo (1).png" alt="Logo de Vértice" class="brand-logo" />
            </div>
            <nav class="sidebar-nav">
                <a href="./comercio.estadisticas.html"><i class="fas fa-chart-line"></i> Estadísticas</a>
                <h3>Administración</h3>
                <a href="comercio.producto.html" class="active"><i class="fas fa-box"></i> Productos</a>
                <a href="/front-vertice/comercio-pedido.html"><i class="fas fa-sitemap"></i> Pedidos</a>
                <a href="/front-vertice/comercio-pickup.html"><i class="fas fa-map-marker-alt"></i> Pick Up Points</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-buttons">
                    <a href="./profile.comercio.html" class="btn btn-secondary">
                        <i class="fas fa-user-circle"></i> Mi Perfil
                    </a>
                </div>
            </header>

            <div class="content-area">
                <h1>Nuevo Producto</h1>
                <form id="form-nuevo-producto" onsubmit="event.preventDefault(); return false;">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto" required />
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" placeholder="Descripción del producto"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" placeholder="Cantidad en stock" required min="0" />
                    </div>
                    <div class="form-group">
                        <label for="precio-original">Precio Original ($)</label>
                        <input type="number" id="precio-original" name="precio-original" placeholder="Precio original"
                            step="0.01" required min="0" />
                    </div>
                    <div class="form-group">
                        <label for="precio_descuento">Precio en Oferta ($)</label>
                        <input type="number" id="precio_descuento" name="precio_descuento"
                            placeholder="Precio en oferta (opcional)" step="0.01" min="0" />
                    </div>
                    <div class="form-group">
                      <label for="categoria-input">Categoría</label>
            <select id="categoria-input" name="categoria" class="form-control">
              <option value="">Selecciona la categoría...</option>
              <option value="comida-por-caducarse">Comida por caducarse</option>
              <option value="desperfecto-fisico">Desperfecto Físico</option>
              <option value="para-donar">Para donar</option>
            </select>
                    </div>
                    <div class="form-group">
                     <label for="tipo-producto">Tipo de Producto</label>
                        <select id="tipo-producto" name="tipo_producto" class="form-control">
                          <option value="">Selecciona un tipo...</option>
                          <option value="lacteos">Lácteos</option>
                          <option value="frescos">Frescos</option>
                          <option value="bebidas">Bebidas</option>
                      </select>
                    </div>
                    <div class="form-group file-upload-group">
                        <label for="imagen">Imagen del Producto</label>
                        <div class="file-upload-box" id="file-upload-box">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span id="file-name">Ningún archivo seleccionado</span>
                        </div>
                        <input type="file" id="imagen" name="foto_url" accept="image/*" class="d-none" />
                    </div>
            </div>

            <div class="form-actions">
                <a href="./comercio.producto.html" class="btn btn-secondary">Cancelar</a>
                <button type="button" class="btn btn-primary" id="guardar-producto-btn">
                    Guardar Producto
                </button>
            </div>
            </form>
    </div>
    </main>
    </div>
    
    <!-- Script de debugging temporal -->
    <script>
        console.log('🎬 === PÁGINA COMERCIO.NUEVO-PRODUCTO CARGADA ===');
        console.log('📍 URL actual:', window.location.href);
        console.log('🔐 Token en localStorage:', localStorage.getItem('token') ? 'SÍ EXISTE' : 'NO EXISTE');
        
        // Detectar cualquier recarga automática
        window.addEventListener('beforeunload', function(e) {
            console.log('⚠️ === LA PÁGINA SE VA A RECARGAR ===');
            console.trace('Stack trace de la recarga:');
        });
        
        // Detectar navegación
        window.addEventListener('unload', function(e) {
            console.log('🚪 === SALIENDO DE LA PÁGINA ===');
        });
    </script>
    
    <!-- Script centralizado para toda la lógica de productos -->
    <script src="./js-vivi/logica-tienda.js"></script>
    
    <script>
        console.log('✅ Script logica-tienda.js cargado');
    </script>
</body>

</html>
