<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puntos de Retiro - Vértice</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sulphur+Point:wght@300;400;700&display=swap" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="./assets/css/comercio.productos.css" />
    <link rel="stylesheet" href="./assets/css/comercio-pickup.css" /> <link rel="icon" type="image/x-icon" href="../front-vertice/assets/imgs/v-vertice.png" />
</head>
<body>
    <style>
        /* --- Estilo de Layout General del Dashboard --- */

  html, body {
    /* Asegura que la página pueda usar la altura completa */
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #f8f9fa; /* Color de fondo general si algo se "escapa" */
  }

  .dashboard-container {
    /* 1. USA FLEXBOX PARA EL LAYOUT */
    /* Esto divide el contenedor en columnas (sidebar y main) */
    display: flex;
    
    /* 2. ALTURA MÍNIMA DE 100% DE LA VENTANA */
    /* Esto fuerza al contenedor a ocupar, como mínimo,
       toda la altura de la pantalla del navegador. */
    min-height: 100vh;
  }

  .sidebar {
    /* 3. ANCHO FIJO PARA EL SIDEBAR */
    /* (Ajusta este número si quieres que sea más ancho o angosto) */
    width: 260px;
    
    /* Evita que el sidebar se encoja si el contenido es muy grande */
    flex-shrink: 0;
    
    /* Fondo blanco (basado en tus capturas) */
    background-color: #ffffff;
    
    /* Un borde sutil para separarlo del contenido */
    border-right: 1px solid #e9ecef;
  }

  .main-content {
    /* 4. EL CONTENIDO TOMA EL RESTO DEL ESPACIO */
    /* "flex-grow: 1" le dice que ocupe todo el espacio sobrante */
    flex-grow: 1;
    
    /* El padding y demás ya lo tienes en tu CSS `comercio.productos.css` */
  }
    </style>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="logo">
                <img src="./assets/imgs/vertice-logo-largo (1).png" alt="Logo de Vértice" class="brand-logo" />
            </div>
            <nav class="sidebar-nav">
                <a href="./comercio.estadisticas.html"><i class="fas fa-chart-line"></i> Estadísticas</a>
                <h3>Administración</h3>
                <a href="comercio.producto.html"><i class="fas fa-box"></i> Productos</a>
                <a href="./comercio-pedido.html"><i class="fas fa-sitemap"></i> Pedidos</a>
                <a href="comercio-pickup.html" class="active"><i class="fas fa-map-marker-alt"></i> Pick Up Points</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                 </header>

            <div class="content-area">
                <h1>Nuestros Puntos de Retiro</h1>
                <p class="lead mb-4">Estos son los puntos de retiro fijos en Formosa donde tus clientes podrán buscar sus pedidos.</p>

                <div class="alert alert-success" role="alert" style="background-color: #e6f7ea; border-color: #4cd309; color: #0b6b2d;">
                    <h4 class="alert-heading" style="color: #4cd309;"><i class="fas fa-info-circle"></i> ¿Por qué usamos Puntos Fijos?</h4>
                    <p>En Vértice actuamos como un puente...</p>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header">
                        Mapa de Puntos de Retiro
                    </div>
                    <div class="card-body">
                        <div id="map" class="map-container"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="./js-vivi/comercio-pickup.js"></script>
</body>
</html>
