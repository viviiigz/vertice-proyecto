    <style>
  /* --- Estilo General para los Botones --- */

  /* 1. Define el estilo base para TODOS los .btn */
  .btn {
    text-decoration: none !important;
    outline: none !important;
    box-shadow: none !important;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    padding: 10px 18px;
    gap: 8px;
    display: inline-flex;
    align-items: center;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  /* 2. ESTILO PARA BOTONES VERDES (Primarios) */
  .btn-primary {
    background-color: #28a745;
    color: white !important;
  }

  .btn-primary:hover {
    background-color: #218838;
  }

  /* 3. ESTILO PARA BOTONES GRISES (Secundarios) */
  .btn-secondary {
    background-color: #f0f2f5;
    color: #444 !important;
  }

  .btn-secondary:hover {
    background-color: #e2e6ea;
  }

  /* 4. ESPACIO ENTRE BOTONES DEL HEADER */
  .header-buttons {
    display: flex;
    gap: 12px;
    /* <-- Este es el espacio extra */
  }
  /* --- Estilo de Layout General del Dashboard --- */
  .sidebar {
    width: 270px !important;
    background-color: #fff;
    padding: 20px !important;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
}
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
}
  .content-area {
    margin-top: 1rem;
    padding: 2em !important;
    flex-grow: 1;
}

</style>
