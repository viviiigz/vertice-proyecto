<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vértice - Tu Mercado Sostenible</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Sulphur+Point:wght@700&display=swap"
    />
  <link rel="stylesheet" href="./assets/css/estilos-tienda.css" />
  <link rel="stylesheet" href="./assets/css/estilos-productos.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../front-vertice/assets/imgs/v-vertice.png"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
<body>
    <header class="main-header">
      <div class="header-top">
        <div class="logo-container">
          <img
            src="./assets/imgs/vertice-logo-largo (1).png"
            alt="Logo de Vértice"
            class="header-logo"
          />
        </div>
        <div class="search-bar">
          <input
            type="text"
            id="search-input"
            placeholder="Buscar productos..."
          />
          <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-actions">
          <a href="./profile.consumidor.html" class="profile-btn"
            ><i class="fas fa-user"></i> Mi Perfil</a
          >
          <button class="cart-btn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count" class="cart-count">0</span>
          </button>
        </div>
      </div>
        <nav class="main-nav">
          <a href="./usuario.tienda.html">Inicio</a>
          <a href="./vista-producto-user.html" class="active">Productos</a>
          <a href="./consumidor.mis-pedidos.html">Mis Pedidos</a>
          <a href="./consumidor-contactanos.html">Contáctanos</a>
          <a href="./consumidor-pickup.html">Puntos Pick Up</a>
        </nav>
    </header>

    <main class="main-content">
      <section class="category-carousel-section">
        <div class="carousel-nav">
          <a href="#" class="active" data-categoria="">Todos</a>
          <a href="#" data-categoria="lacteos">Lácteos</a>
          <a href="#" data-categoria="frutas-y-verduras">Frutas y Verduras</a>
          <a href="#" data-categoria="carniceria-polleria">Carnicería y Pollería</a>
          <a href="#" data-categoria="congelados">Congelados</a>
          <a href="#" data-categoria="panaderia">Panadería</a>
          <a href="#" data-categoria="dietetica">Dietética</a>
          <a href="#" data-categoria="snack">Snack</a>
          <a href="#" data-categoria="desayuno-merienda">Desayuno/Merienda</a>
          <a href="#" data-categoria="bebidas">Bebidas</a>
        </div>
      </section>

      <section class="promotions-section">
        <img
          src="./assets/imgs/comprasBaner.png"
          alt="nose"
          class="banner-oferta"
        />
        <div class="promotions-grid1">
          </div>
      </section>

      <section id="productos">
        <!-- Contenedor de productos para vista.usuario.js -->
        <div class="product-grid" id="product-grid-container"></div>
      </section>

      <section class="promotions-section-banco-alimentos">
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo-section">
                    <img src="assets/imgs/v-vertice.png" alt="Vértice Logo" class="footer-logo">
                    <p>IPF &copy;2025 Vértice.</p>
                </div>
                <div class="footer-links-section">
                    <ul> 
                        <li><a href="usuario.tienda.html">| Inicio</a></li>
                        <li><a href="vista-producto-user.html">| Productos</a></li>
                       <li><a href="consumidor.mis-pedidos.html">| Mis Pedidos</a></li>
                        <li><a href="consumidor-contactanos.html">| Contáctanos</a></li>
                        <li><a href="consumidor-pickup.html">| Puntos Pick Up |</a></li>
                    </ul>
                </div>
                <div class="footer-socials-section">
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./js-vivi/notifications.js"></script>
    <script src="./js-vivi/cart-persistence.js"></script>
    <script>
        // Agregar funcionalidad al botón del carrito
        document.addEventListener('DOMContentLoaded', () => {
            const cartBtn = document.querySelector('.cart-btn');
            if (cartBtn) {
                cartBtn.addEventListener('click', () => {
                    window.location.href = './consumidor.carrito.html';
                });
            }
        });
    </script>
    <script type="module" src="./js-vivi/vista.usuario.js"></script>
  </body>
</html>
