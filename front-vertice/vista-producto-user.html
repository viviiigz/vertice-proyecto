<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vértice - Tu Mercado Sostenible</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Sulphur+Point:wght@700&display=swap"
    />
  <link rel="stylesheet" href="./assets/css/estilos-tienda.css" />
  <link rel="stylesheet" href="./assets/css/estilos-productos.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../front-vertice/assets/imgs/v-vertice.png"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
<body>
    <header class="main-header">
      <div class="header-top">
        <div class="logo-container">
          <img
            src="./assets/imgs/vertice-logo-largo (1).png"
            alt="Logo de Vértice"
            class="header-logo"
          />
        </div>
        <div class="search-bar">
          <input
            type="text"
            id="search-input"
            placeholder="Buscar productos..."
          />
          <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-actions">
          <a href="#" class="profile-btn"
            ><i class="fas fa-user"></i> Mi Perfil</a
          >
          <button class="cart-btn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count" class="cart-count">0</span>
          </button>
        </div>
      </div>
        <nav class="main-nav">
          <a href="./usuario.tienda.html">Inicio</a>
          <a href="./vista-producto-user.html" class="active">Productos</a>
          <a href="./consumidor-contactanos.html">Contáctanos</a>
          <a href="./consumidor-pickup.html">Puntos Pick Up</a>
        </nav>
    </header>

    <main class="main-content">
      <section class="category-carousel-section">
        <div class="carousel-nav">
          <a href="#todos" class="active">Todos</a>
          <a href="./consumidor-lacteos.html">Lacteos</a>
          <a href="./consumidor-bebidas.html">Bebidas</a>
          <a href="./consumidor-frescos.html">Frescos</a> 
        </div>
      </section>

      <section class="promotions-section">
        <img
          src="./assets/imgs/ofertayogur.png"
          alt="nose"
          class="banner-oferta"
        />
        <div class="promotions-grid1">
          </div>
      </section>

      <section id="productos">
        <!-- Contenedor de productos para vista.usuario.js -->
        <div class="product-grid" id="product-grid-container"></div>
      </section>

      <section class="promotions-section-banco-alimentos">
        </section>
    </main>

    <footer class="main-footer">
      <p>© 2025 Vértice. Todos los derechos reservados.</p>
    </footer>

    <script src="./js-vivi/cart-persistence.js"></script>
    <script src="./js-vivi/vista.usuario.js"></script>
  </body>
</html>
