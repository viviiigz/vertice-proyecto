<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Donaciones - Vértice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="./assets/css/estilos-tienda.css" />
    <link rel="stylesheet" href="./assets/css/estilos-productos.css">
    <link rel="stylesheet" href="./assets/css/banco-dashboard.css" />
    <link rel="icon" type="image/x-icon" href="../front-vertice/assets/imgs/v-vertice.png" />
</head>

<body class="banco-mode">
    <header class="main-header sticky-top">
        <div class="header-top">
            <div class="logo-container">
                <img src="./assets/imgs/vertice-logo-largo (1).png" alt="Logo" class="header-logo" />
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar por tipo de alimento..." />
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="/front-vertice/profile.consumidor.html" class="profile-btn"><i class="fas fa-user"></i> Mi Organización</a>
                <button class="cart-btn"><i class="fas fa-box-open"></i> <span id="cart-count" class="cart-count">0</span></button>
            </div>
        </div>
        <nav class="main-nav">
            <a href="./banco.alimentos.html">Inicio</a>
            <a href="./banco-donaciones.html" class="active">Donaciones</a>
            <a href="./banco-soporte.html">Soporte</a>
            <a href="./banco-pickup.html">Mapa Recolección</a>
        </nav>
    </header>

    <main class="container px-4 py-4 main-dashboard-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-boxes me-2 text-success"></i>Donaciones Disponibles</h2>
            
            <div class="btn-group">
                <button class="btn btn-outline-success active" onclick="filtrar('todos')">Todos</button>
                <button class="btn btn-outline-success" onclick="filtrar('panificados')">Panificados</button>
                <button class="btn btn-outline-success" onclick="filtrar('frutas')">Frutas/Verduras</button>
                <button class="btn btn-outline-success" onclick="filtrar('lacteos')">Lácteos</button>
            </div>
        </div>

        <div id="donaciones-grid" class="row g-4">
            
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-3 text-muted fw-bold">Consultando disponibilidad de donaciones...</p>
            </div>

        </div>


    </main>
                <!-- --- Footer ---- -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo-section">
                    <img src="assets/imgs/v-vertice.png" alt="Vértice Logo" class="footer-logo">
                    <p>IPF &copy;2025 Vértice.</p>
                </div>
                <div class="footer-links-section">
                    <ul> 
                        <li><a href="usuario.tienda.html">| Inicio</a></li>
                        <li><a href="vista-producto-user.html">| Productos</a></li>
                        <li><a href="consumidor-contactanos.html">| Contáctanos</a></li>
                        <li><a href="consumidor-pickup.html">| Puntos Pick Up |</a></li>
                    </ul>
                </div>
                <div class="footer-socials-section">
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="./js-vivi/banco-dashboard.js"></script>
</body>
</html>
