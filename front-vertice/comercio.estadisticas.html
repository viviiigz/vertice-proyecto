<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estadísticas - Vértice</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sulphur+Point:wght@300;400;700&display=swap" />
  <link rel="stylesheet" href="./assets/css/comercio.estadisticas.css" />
  <link rel="icon" type="image/x-icon" href="../front-vertice/assets/imgs/v-vertice.png" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<style>
  /* --- Estilo General para los Botones --- */

  /* 1. Define el estilo base para TODOS los .btn */
  .btn {
    text-decoration: none !important;
    outline: none !important;
    box-shadow: none !important;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    padding: 10px 18px;
    gap: 8px;
    display: inline-flex;
    align-items: center;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  /* 2. ESTILO PARA BOTONES VERDES (Primarios) */
  .btn-primary {
    background-color: #28a745;
    color: white !important;
  }

  .btn-primary:hover {
    background-color: #218838;
  }

  /* 3. ESTILO PARA BOTONES GRISES (Secundarios) */
  .btn-secondary {
    background-color: #f0f2f5;
    color: #444 !important;
  }

  .btn-secondary:hover {
    background-color: #e2e6ea;
  }

  /* 4. ESPACIO ENTRE BOTONES DEL HEADER */
  .header-buttons {
    display: flex;
    gap: 12px;
    /* <-- Este es el espacio extra */
  }
  /* --- Estilo de Layout General del Dashboard --- */

  html, body {
    /* Asegura que la página pueda usar la altura completa */
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #f8f9fa; /* Color de fondo general si algo se "escapa" */
  }

  .dashboard-container {
    /* 1. USA FLEXBOX PARA EL LAYOUT */
    /* Esto divide el contenedor en columnas (sidebar y main) */
    display: flex;
    
    /* 2. ALTURA MÍNIMA DE 100% DE LA VENTANA */
    /* Esto fuerza al contenedor a ocupar, como mínimo,
       toda la altura de la pantalla del navegador. */
    min-height: 100vh;
  }

  .sidebar {
    /* 3. ANCHO FIJO PARA EL SIDEBAR */
    /* (Ajusta este número si quieres que sea más ancho o angosto) */
    width: 260px;
    
    /* Evita que el sidebar se encoja si el contenido es muy grande */
    flex-shrink: 0;
    
    /* Fondo blanco (basado en tus capturas) */
    background-color: #ffffff;
    
    /* Un borde sutil para separarlo del contenido */
    border-right: 1px solid #e9ecef;
  }

  .main-content {
    /* 4. EL CONTENIDO TOMA EL RESTO DEL ESPACIO */
    /* "flex-grow: 1" le dice que ocupe todo el espacio sobrante */
    flex-grow: 1;
    
    /* El padding y demás ya lo tienes en tu CSS `comercio.productos.css` */
  }
</style>

<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo">
        <img src="./assets/imgs/vertice-logo-largo (1).png" alt="Logo de Vértice" class="brand-logo" />
      </div>
      <nav class="sidebar-nav">
        <a href="./comercio.estadisticas.html" class="active"><i class="fas fa-chart-line"></i> Estadísticas</a>
        <h3>Administración</h3>
        <a href="./comercio.producto.html"><i class="fas fa-box"></i> Productos</a>
        <a href="/front-vertice/comercio-pedido.html"><i class="fas fa-sitemap"></i> Pedidos</a>
        <a href="./comercio-pickup.html"><i class="fas fa-map-marker-alt"></i> Pick Up Points</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-buttons">
          <a href="./profile.comercio.html" class="btn btn-secondary">
            <i class="fas fa-user-circle"></i> Mi Perfil
          </a>
        </div>
      </header>

      <div class="content-area">
        <h1>Estadísticas</h1>
        <div class="stats-grid">
          <div class="stat-card">
            <h4>Total de Ventas</h4>
            <p class="stat-value">$0</p>
          </div>
          <div class="stat-card">
            <h4>Nuevos Pedidos</h4>
            <p class="stat-value">0</p>
          </div>
          <div class="stat-card">
            <h4>Productos Vendidos</h4>
            <p class="stat-value">0</p>
          </div>
        </div>
        <div class="chart-section">
          <h3>Gráfico de Ventas</h3>
          <div class="chart-placeholder">
            <canvas id="ventasChart"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="./js-vivi/comercio.js"></script>
</body>

</html>
