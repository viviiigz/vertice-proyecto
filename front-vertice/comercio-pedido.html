<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos - Vértice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sulphur+Point:wght@300;400;700&display=swap" />

    <link rel="stylesheet" href="./assets/css/comercio.productos.css" />
    <link rel="stylesheet" href="./assets/css/comercio-pedido.css" />
    <link rel="icon" type="image/x-icon" href="../front-vertice/assets/imgs/v-vertice.png" />
</head>

<style>
  /* --- Estilo General para los Botones --- */

  /* 1. Define el estilo base para TODOS los .btn */
  .btn {
    text-decoration: none !important;
    outline: none !important;
    box-shadow: none !important;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    padding: 10px 18px;
    gap: 8px;
    display: inline-flex;
    align-items: center;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  /* 2. ESTILO PARA BOTONES VERDES (Primarios) */
  .btn-primary {
    background-color: #28a745;
    color: white !important;
  }

  .btn-primary:hover {
    background-color: #218838;
  }

  /* 3. ESTILO PARA BOTONES GRISES (Secundarios) */
  .btn-secondary {
    background-color: #f0f2f5;
    color: #444 !important;
  }

  .btn-secondary:hover {
    background-color: #e2e6ea;
  }

  /* 4. ESPACIO ENTRE BOTONES DEL HEADER */
  .header-buttons {
    display: flex;
    gap: 12px;
    /* <-- Este es el espacio extra */
  }
  /* --- Estilo de Layout General del Dashboard --- */
  .content-area {
    margin-top: 1rem;
    padding: 2em !important;
    flex-grow: 1;
}

  .sidebar {
    width: 270px !important;
    background-color: #fff;
    padding: 20px !important;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
}
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
}
    
    /* El padding y demás ya lo tienes en tu CSS `comercio.productos.css` */
  
</style>




<body>
    <div class="dashboard-container">

        <aside class="sidebar">
            <div class="logo">
                <img src="./assets/imgs/vertice-logo-largo (1).png" alt="Logo de Vértice" class="brand-logo" />
            </div>
            <nav class="sidebar-nav">
                <a href="./comercio.estadisticas.html"><i class="fas fa-chart-line"></i> Estadísticas</a>
                                            <a href="comercio.producto.html"><i class="fas fa-box"></i> Productos</a>
                <a href="./comercio-pedido.html" class="active"><i class="fas fa-sitemap"></i> Pedidos</a>
                <a href="/front-vertice/comercio-pickup.html"><i class="fas fa-map-marker-alt"></i> Pick Up Points</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="header">
                <div class="header-buttons">
                    <a href="./profile.comercio.html" class="btn btn-secondary">
                        <i class="fas fa-user-circle"></i> Mi Perfil
                    </a>
                </div>
            </header>

            <div class="content-area">
                <h1>Gestión de Pedidos</h1>

                <div class="toolbar d-flex justify-content-between align-items-center flex-wrap mb-3">

                    <div class="input-group" style="max-width: 400px;">
                        <input type="text" class="form-control" placeholder="Buscar por cliente o N° de pedido...">
                        <button class="btn btn-outline-secondary" type="button">
                            <i class="fas fa-search"></i> Buscar
                        </button>
                    </div>

                    <div class="btn-group" role="group" aria-label="Filtros de estado">
                        <button type="button" class="btn btn-primary">Pendientes</button>
                        <button type="button" class="btn btn-outline-secondary">Completados</button>
                        <button type="button" class="btn btn-outline-secondary">Cancelados</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle bg-white rounded-3 shadow-sm">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Cliente</th>
                                <th scope="col">Pedido</th>
                                <th scope="col">Total</th>
                                <th scope="col">Punto de Retiro</th>
                                <th scope="col">Horario</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="pedidos-tabla-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/comercio-pedidos.js"></script>
</body>

</html>
