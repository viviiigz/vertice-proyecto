<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Solicitudes Pendientes | Vértice</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./assets/css/admin-style.css">
    <link rel="icon" type="image/x-icon" href="./assets/imgs/v-vertice.png" />
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="bg-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold border-bottom">
                <img src="./assets/imgs/vertice-logo-largo (1).png" alt="Vértice" height="40">
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="./admin-dashboard.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="vista-adminVERTICE.html" class="list-group-item list-group-item-action bg-transparent second-text active">
                    <i class="fas fa-clipboard-list me-2"></i>Solicitudes <span class="badge bg-danger rounded-pill ms-2" id="sidebar-badge-count">0</span>
                </a>
                <a href="./admin-comercios.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-store me-2"></i>Comercios
                </a>
                <a href="./admin-reportes.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
                    <i class="fas fa-chart-line me-2"></i>Reportes
                </a>

            </div>
        </div>
        <div id="page-content-wrapper">
            
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
                    <h2 class="fs-2 m-0 text-dark fw-bold">Gestión de Solicitudes</h2>
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle second-text fw-bold" href="#" id="navbarDropdown"
                                role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user-shield me-2"></i>Administrador
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#">Configuración</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" id="btnLogout">Cerrar Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid px-4">
                
                <div id="adminAlert"></div>

                <div class="row my-4">
                    <div class="col">
                        <div class="card shadow-sm border-0 rounded-3">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <h5 class="mb-0 fw-bold text-dark">Bancos Pendientes de Aprobación</h5>
                                <button class="btn btn-sm btn-outline-primary" onclick="loadSolicitudes()">
                                    <i class="fas fa-sync-alt"></i> Actualizar
                                </button>
                            </div>
                            
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0 bg-white">
                                        <thead class="bg-light">
                                            <tr>
                                                <th scope="col" class="ps-4">Nombre Organización</th>
                                                <th scope="col">Contacto</th>
                                                <th scope="col">Documentación</th>
                                                <th scope="col">Estado</th>
                                                <th scope="col" class="text-end pe-4">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="solicitudesBody">
                                            <tr id="noDataRow" style="display:none;">
                                                <td colspan="5" class="text-center py-5">
                                                    <div class="text-muted">
                                                        <i class="fas fa-check-circle fa-3x mb-3 text-success opacity-50"></i>
                                                        <p class="mb-0">¡Todo al día! No hay solicitudes pendientes.</p>
                                                    </div>
                                                </td>
                                            </tr>
                                            </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content h-100">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-pdf me-2 text-danger"></i>Documento de Verificación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="height: 80vh;">
                    <iframe id="previewFrame" src="" class="w-100 h-100 border-0 rounded"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js-vivi/admin-logic.js"></script>
    
    <script>
        var el = document.getElementById("wrapper");
        var toggleButton = document.getElementById("menu-toggle");
        toggleButton.onclick = function () {
            el.classList.toggle("toggled");
        };
    </script>
</body>
</html>
